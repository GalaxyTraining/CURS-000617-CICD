name: CURS-000617-AI-Assisted-Java
services:
  postgres:
    image: postgres:16-alpine
    container_name: contract-api-postgres
    environment:
      POSTGRES_DB: contracts
      POSTGRES_USER: contract
      POSTGRES_PASSWORD: ${DB_PASSWORD:-contract}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
